<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Villas Tours - Propyter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="tour-page-container">
        <header class="top-bar">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="propryter-logo.png" alt="Propyter Logo">
            </div>
            <a href="https://www.propryter.com" target="_blank" class="visit-us-btn">Visit Us ↗</a>
        </header>

        <a href="index.html" class="back-link">← Back to Portfolios</a>
        
        <div class="page-header-block">
            <span class="sub-badge">EXCLUSIVE SHOWCASE</span>
            <h2>Nashik Properties</h2>
            <p>hi</p>
        </div>

        <div class="prop-content" style="padding: 0 0 16px 0;">
            <h3>BelAir Luxury Residence</h3>
            <p class="prop-loc">Nashik Road, Nashik</p>
            <p class="prop-desc">helo</p>
        </div>

        <div class="pdf-scroll-container">
            <iframe src="Properties/1pdf.pdf" width="100%" height="100%" style="border: none;">
                <p>Your browser does not support PDFs. You can <a href="Properties/1pdf.pdf" target="_blank">download the PDF here</a>.</p>
            </iframe>
        </div>

        <div class="media-wrapper portrait-media">
            <video id="tourVideo" controls>
                <source src="Properties/1video.mp4" type="video/mp4">
                Your browser does not support video.
            </video>
        </div>

        <script>
            const video = document.getElementById('tourVideo');
            video.addEventListener('loadedmetadata', function() {
                video.currentTime = 6;
            });
        </script>

        <div class="prop-content drone-section">
            <h4>Interactive Drone View</h4>
            <p>airshot</p>
            <div class="drone-embed-container">
                <iframe src="https://digitour.housing.com/drone-view/housing_belair_nashik_v1" width="100%" height="100%" style="border: none;" allowfullscreen>
                    <p>Your browser does not support iframe embeds. <a href="https://digitour.housing.com/drone-view/housing_belair_nashik_v1" target="_blank">Open drone view in a new tab ↗</a></p>
                </iframe>
            </div>
        </div>

    </div>

</body>
</html>
